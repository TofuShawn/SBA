[package]
name = "sba-core"
version = "0.1.0"
edition = "2021"

# D55 Phase A: the Rust core. The AZNet model is hand-written in burn
# (readable, no codegen), weights come from PyTorch via safetensors, and
# the wgpu backend runs inference on Vulkan/DX12 — pure Rust, no C++
# runtime. bench_burn is the inference spike; the PUCT tree and the
# self-play loop land here next.

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench_burn"
path = "src/bench_burn.rs"

[dependencies]
burn = { version = "0.16", features = ["wgpu"] }
safetensors = "0.4"
bytemuck = "1"
