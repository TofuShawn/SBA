[package]
name = "sba-core"
version = "0.1.0"
edition = "2021"

# D55 Phase A: the Rust core. The AZNet model is hand-written in burn
# (readable, no codegen), weights come from PyTorch via safetensors, and
# the wgpu backend runs inference on Vulkan/DX12 — pure Rust, no C++
# runtime. bench_burn is the inference spike; the PUCT tree and the
# self-play loop land here next.

[lib]
path = "src/lib.rs"

[[bin]]
name = "bench_burn"
path = "src/bench_burn.rs"

[features]
default = ["wgpu"]
wgpu = ["burn/wgpu"]
cpu = ["burn/candle"]

[dependencies]
burn = { version = "0.16", default-features = false }
safetensors = "0.4"
bytemuck = "1"
# search.rs: StdRng seeding + uniform move sampling (rand), root-prior
# Dirichlet noise (rand_distr) — 0.8/0.4 lines to match the sketch APIs
# (Rng::gen, Dirichlet::new(&[f64]) -> Vec<f64>).
rand = "0.8"
rand_distr = "0.4"
sba_game = { path = "../sba-game" }
