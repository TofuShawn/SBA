# sba_game — the Ultimate Tic-Tac-Toe state layer in Rust (D48, Phase 1).
#
# Game LOGISTICS only: apply / legal moves / result / clone / state dump.
# The search algorithms stay in Python (research reference) and in
# sba_engine.dll (the fast path); game.py stays the pure-Python reference
# implementation and the fallback when this cdylib is not built.

[package]
name = "sba_game"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
