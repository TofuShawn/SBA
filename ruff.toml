# Ruff — F (pyflakes) + E9 (syntax) + E7 (naming/multiline basics).
# E741 is per-file-ignored where `O` IS the domain constant: the second
# player's mark cannot be renamed to satisfy a linter.
line-length = 100

exclude = [
    "docs",            # report/diagram scripts, not project code
    "logs",            # scratch + the ai.py pre-split backup
]

[lint]
select = ["F", "E9", "E7"]

[lint.per-file-ignores]
# the facade re-exports the whole engine surface on purpose (from ai import
# ... is the historical API) — F401 is the contract there, not a finding
"src/ai.py" = ["F401"]
# the MIOpen env pins MUST run before `import torch` (they redirect the
# kernel cache off the network drive) — the imports after them are E402 by
# design, moving them up breaks the fix
"src/alphazero.py" = ["E402", "E741"]
# `O` is the second player's mark — the domain names the constant
"src/game.py" = ["E741"]
