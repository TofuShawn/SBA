# Tool configuration for pytest and ruff — one shared home instead of a
# config file per tool.
#
# Why no [project] packaging block: SBA ships as a source tree (the release
# zip runs from source via sba.py/start.bat), so there is nothing to pip
# install, and a metadata block nobody builds would be decorative.
#
# The import layout is one-level function packages under src/ on sys.path
# (core/engines/az/analysis/ui/session — D61, amending D36's flat src/),
# with config.py the root leaf; the split is a deliberately frozen decision
# — see docs/decisions.md before restructuring imports.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# .pytest_cache has a broken ACL on the dev machine (WinError 5 noise on
# every run) and the suite gains nothing from it — see docs/development.md
addopts = "-p no:cacheprovider"

[tool.ruff]
# Ruff — F (pyflakes) + E9 (syntax) + E7 (naming/multiline basics)
# + B (bugbear) + SIM (simplify) + PERF (perflint).
# E741 is per-file-ignored where `O` IS the domain constant: the second
# player's mark cannot be renamed to satisfy a linter.
# S (bandit), RUF, I (isort) and UP (pyupgrade) are intentionally NOT
# selected: they mostly flag style rather than defects on this codebase.
line-length = 100

exclude = [
    "docs",            # report/diagram scripts, not project code
    "logs",            # scratch + the ai.py pre-split backup
]

[tool.ruff.lint]
select = ["F", "E9", "E7", "B", "SIM", "PERF"]

[tool.ruff.lint.per-file-ignores]
# the facade re-exports the whole engine surface on purpose (from ai import
# ... is the historical API) — F401 is the contract there, not a finding
"src/engines/ai.py" = ["F401"]
# the MIOpen env pins MUST run before `import torch` (they redirect the
# kernel cache off the network drive) — the imports after them are E402 by
# design, moving them up breaks the fix
"src/az/alphazero.py" = ["E402", "E741"]
# `O` is the second player's mark — the domain names the constant
"src/core/game.py" = ["E741"]

[tool.mypy]
# The type gate covers ONLY the two ctypes FFI boundary modules (the `mypy`
# task in dev.py / CI passes exactly those two files). Everything here is
# scoped to keep it that way:
# - ignore_missing_imports: ctypes/numpy/third-party have no installed stubs
# - follow_imports=silent: cengine/rustbridge pull in config.py and
#   core/game.py; their errors belong to their own gates, not this one
#   (modules passed explicitly on the command line still report)
ignore_missing_imports = true
follow_imports = "silent"

# check_untyped_defs lives HERE (not global): untyped bodies are only
# checked where the FFI actually bites.
[[tool.mypy.overrides]]
module = ["engines.cengine", "az.rustbridge"]
check_untyped_defs = true

[tool.ruff.lint.mccabe]
# C901 is deliberately NOT in the lint gate selection above — max-complexity
# only takes effect for the warn-only `dev.py complexity` report on src/ui
# (findings print, nothing blocks). The GamePage split decides whether the
# report graduates into a gate.
max-complexity = 10

[tool.coverage.run]
# Measure the package only — tests and tooling are not the product.
source = ["src"]

[tool.coverage.report]
# Baseline measured 2026-11-26: 68% (tui.py is the 0% hole; the Qt UI sits at
# 63%). The floor is a regression guard, not a target: raise it when a module
# gains tests, never lower it to make a red build green.
fail_under = 65
skip_covered = true
