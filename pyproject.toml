# Tool configuration for pytest and ruff — one shared home instead of a
# config file per tool.
#
# Why no [project] packaging block: SBA ships as a source tree (the release
# zip runs from source via sba.py/start.bat), so there is nothing to pip
# install, and a metadata block nobody builds would be decorative.
#
# The import layout is flat (src/ on sys.path, D36) and the src/ package
# split is a deliberately frozen decision — see docs/decisions.md before
# restructuring imports.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# .pytest_cache has a broken ACL on the dev machine (WinError 5 noise on
# every run) and the suite gains nothing from it — see docs/development.md
addopts = "-p no:cacheprovider"

[tool.ruff]
# Ruff — F (pyflakes) + E9 (syntax) + E7 (naming/multiline basics)
# + B (bugbear) + SIM (simplify) + PERF (perflint).
# E741 is per-file-ignored where `O` IS the domain constant: the second
# player's mark cannot be renamed to satisfy a linter.
# S (bandit), RUF, I (isort) and UP (pyupgrade) are intentionally NOT
# selected: they mostly flag style rather than defects on this codebase.
line-length = 100

exclude = [
    "docs",            # report/diagram scripts, not project code
    "logs",            # scratch + the ai.py pre-split backup
]

[tool.ruff.lint]
select = ["F", "E9", "E7", "B", "SIM", "PERF"]

[tool.ruff.lint.per-file-ignores]
# the facade re-exports the whole engine surface on purpose (from ai import
# ... is the historical API) — F401 is the contract there, not a finding
"src/ai.py" = ["F401"]
# the MIOpen env pins MUST run before `import torch` (they redirect the
# kernel cache off the network drive) — the imports after them are E402 by
# design, moving them up breaks the fix
"src/alphazero.py" = ["E402", "E741"]
# `O` is the second player's mark — the domain names the constant
"src/game.py" = ["E741"]
