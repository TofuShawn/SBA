name: Release

# Publish a release package: the tracked source tree (git archive; docs/ is
# export-ignored via .gitattributes — the notes live on the release page,
# the paper trail stays in the repo) plus the natively built sba_engine.dll
# and a start.bat that bootstraps .venv on first launch — users only need
# Python, not a compiler.
#
# Triggers: push a v* tag, or run manually from the Actions tab. The manual
# run publishes only when the `tag` input is filled (e.g. v0.1.0 — the tag
# is created on the checked-out commit automatically); an empty input keeps
# it artifact-only for testing the packaging.
#
# Linux/macOS users build from source: `pip install -r requirements.txt`
# then `python src/tools/build.py` (see README §2).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (empty = package without publishing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install MinGW gcc
        shell: bash
        run: |
          # the mingw-builds CDN intermittently 504s — retry before giving up
          for i in 1 2 3 4; do
            choco install mingw -y --no-progress && break
            echo "choco attempt $i failed; retrying in 20s"
            sleep 20
          done
          test -f /c/ProgramData/mingw64/mingw64/bin/gcc.exe || {
            echo "mingw gcc not installed"; exit 1; }
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Build native engines (sba_engine.dll + sba_game.dll)
        run: python src/tools/build.py

      - name: Smoke-load the engines
        run: |
          python -c "import ctypes; ctypes.CDLL('src/engines/sba_engine.dll'); print('engine ok')"
          python -c "import ctypes, os; p='src/az/sba_game.dll'; os.path.isfile(p) and ctypes.CDLL(p); print('game layer ok (built)' if os.path.isfile(p) else 'game layer absent (no cargo)')"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package source + prebuilt engine
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag || format('dev-{0}', github.run_number) }}
        run: |
          mkdir -p dist
          ZIP="dist/SBA-${TAG}-windows-x64.zip"
          git archive --format=zip -o "$ZIP" HEAD
          # ship the repo's own launcher when tracked; otherwise generate
          # the venv-bootstrap start.bat (mirrors the SBA.py entry point)
          if git cat-file -e HEAD:start.bat 2>/dev/null; then
            python - "$ZIP" <<'PY'
          import os, sys, zipfile
          with zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED) as z:
              z.write('start.bat', 'start.bat')
              z.write('src/engines/sba_engine.dll', 'src/engines/sba_engine.dll')
              if os.path.isfile('src/az/sba_game.dll'):
                  z.write('src/az/sba_game.dll', 'src/az/sba_game.dll')
          print('packed: tracked start.bat + engines')
          PY
          else
            python - "$ZIP" <<'PY'
          import os, sys, zipfile
          lines = [
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set "PY=.venv\\Scripts\\python.exe"',
              'if not exist "%PY%" (',
              '    echo [SBA] Creating virtual environment ...',
              '    python -m venv .venv',
              '    if errorlevel 1 exit /b 1',
              '    echo [SBA] Installing dependencies ...',
              '    "%PY%" -m pip install -r requirements.txt',
              '    if errorlevel 1 exit /b 1',
              ')',
              'echo [SBA] Starting ...',
              '"%PY%" sba.py %*',
          ]
          with zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED) as z:
              z.writestr('start.bat', '\r\n'.join(lines) + '\r\n')
              z.write('src/engines/sba_engine.dll', 'src/engines/sba_engine.dll')
              if os.path.isfile('src/az/sba_game.dll'):
                  z.write('src/az/sba_game.dll', 'src/az/sba_game.dll')
          print('packed: generated start.bat + engines')
          PY
          fi
          sha256sum "$ZIP" > "$ZIP".sha256

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the report set (static / embedded / PDF)
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag || format('dev-{0}', github.run_number) }}
          PYTHONUTF8: '1'  # the runner's stdout is cp1252 — the pipeline prints Chinese
        run: |
          # the tech report ships as standalone single-file assets beside the
          # zip: a zero-dependency static HTML build, then the share trims,
          # the embedded-CJK-font variant, and the Chrome-printed A4 PDF.
          # The VF is vendored (docs/assets/fonts, OFL) so no system fonts
          # are needed on the runner. bash shell: pwsh continues on error and
          # would mask a failed step; the output dirs are gitignored and must
          # be created here (make-share does not mkdir its parent).
          python -m pip install --quiet fonttools brotli pypdf
          cd docs/static-build
          mkdir -p ../static ../share
          npm ci --silent
          node build-static.mjs ../AlphaZero_UTTT_Technical_Report.html ../static/AlphaZero_UTTT_Technical_Report.html
          python make-share.py ../static/AlphaZero_UTTT_Technical_Report.html ../share/AlphaZero_UTTT_Technical_Report.html --drop s12 --drop s15
          python embed-cjk-fonts.py ../share/AlphaZero_UTTT_Technical_Report.html ../share/report_embedded.html
          python make-pdf.py ../share/report_embedded.html
          cd ../..
          cp docs/share/report_embedded.html "dist/SBA-${TAG}-report.html"
          cp docs/share/pdf/report_embedded.pdf "dist/SBA-${TAG}-report.pdf"

      - uses: actions/upload-artifact@v7
        with:
          name: SBA-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # written notes win (docs/releases/<tag>.md); tags without one
          # fall back to the auto-generated commit list
          if [ -f "docs/releases/${TAG}.md" ]; then
            gh release create "$TAG" dist/* \
              --title "SBA $TAG" \
              --notes-file "docs/releases/${TAG}.md"
          else
            gh release create "$TAG" dist/* \
              --title "SBA $TAG" \
              --generate-notes
          fi
