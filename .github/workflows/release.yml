name: Release

# Publish a release package: the tracked source tree (git archive) plus the
# natively built sba_engine.dll and a start.bat that bootstraps .venv on
# first launch — users only need Python, not a compiler.
#
# Triggers: push a v* tag, or run manually from the Actions tab. The manual
# run publishes only when the `tag` input is filled (e.g. v0.1.0 — the tag
# is created on the checked-out commit automatically); an empty input keeps
# it artifact-only for testing the packaging.
#
# Linux/macOS users build from source: `pip install -r requirements.txt`
# then `python native/build.py` (see README §2).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (empty = package without publishing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    name: Package (windows-x64)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MinGW gcc
        shell: bash
        run: |
          # the mingw-builds CDN intermittently 504s — retry before giving up
          for i in 1 2 3 4; do
            choco install mingw -y --no-progress && break
            echo "choco attempt $i failed; retrying in 20s"
            sleep 20
          done
          test -f /c/ProgramData/mingw64/mingw64/bin/gcc.exe || {
            echo "mingw gcc not installed"; exit 1; }
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Build native engine (sba_engine.dll)
        run: python native/build.py

      - name: Smoke-load the engine
        run: python -c "import ctypes; ctypes.CDLL('native/sba_engine.dll'); print('engine ok')"

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package source + prebuilt engine
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag || format('dev-{0}', github.run_number) }}
        run: |
          mkdir -p dist
          ZIP="dist/SBA-${TAG}-windows-x64.zip"
          git archive --format=zip -o "$ZIP" HEAD
          # ship the repo's own launcher when tracked; otherwise generate
          # the venv-bootstrap start.bat (mirrors the SBA.py entry point)
          if git cat-file -e HEAD:start.bat 2>/dev/null; then
            python - "$ZIP" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED) as z:
              z.write('start.bat', 'start.bat')
              z.write('native/sba_engine.dll', 'native/sba_engine.dll')
          print('packed: tracked start.bat + engine')
          PY
          else
            python - "$ZIP" <<'PY'
          import sys, zipfile
          lines = [
              '@echo off',
              'setlocal',
              'cd /d "%~dp0"',
              'set "PY=.venv\\Scripts\\python.exe"',
              'if not exist "%PY%" (',
              '    echo [SBA] Creating virtual environment ...',
              '    python -m venv .venv',
              '    if errorlevel 1 exit /b 1',
              '    echo [SBA] Installing dependencies ...',
              '    "%PY%" -m pip install -r requirements.txt',
              '    if errorlevel 1 exit /b 1',
              ')',
              'echo [SBA] Starting ...',
              '"%PY%" sba.py %*',
          ]
          with zipfile.ZipFile(sys.argv[1], 'a', zipfile.ZIP_DEFLATED) as z:
              z.writestr('start.bat', '\r\n'.join(lines) + '\r\n')
              z.write('native/sba_engine.dll', 'native/sba_engine.dll')
          print('packed: generated start.bat + engine')
          PY
          fi
          sha256sum "$ZIP" > "$ZIP".sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SBA-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --title "SBA $TAG" \
            --generate-notes
