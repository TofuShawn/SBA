            PYSEC-2026-4332  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4334  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4335  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4336  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4337  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4338  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4339  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4340  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4341  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4342  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4343  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4363  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
          )
          FLAGS=()
          for id in "${IGNORED[@]}"; do FLAGS+=(--ignore-vuln "$id"); done
          pip-audit --desc off "${FLAGS[@]}"

      # The C engine used to compile with no warning flags at all, and
      # build.py swallowed successful builds' stderr. This is the gate;
      # -D__stdcall= is the same define build.py uses on a Linux host.
      - name: C warnings
        run: |
          for f in src/engines/sba_ultt.c src/engines/sba_rollout.c \
                   src/engines/sba_mcts.c src/engines/sba_rave.c \
                   src/engines/sba_minimax.c; do
            gcc -std=c11 -fsyntax-only -Wall -Wextra -Werror \
                -D__stdcall= -Isrc/engines "$f"
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # the crate has compiled clean here since D49 — clippy is a gate now
      # (D60 workspace: cargo runs at the repo root, -p selects the crate)
      - name: Clippy
        run: cargo clippy --release -p sba_game -- -D warnings

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy (sba-core)
        if: runner.os == 'Linux'
        run: cargo clippy --release -p sba-core -- -D warnings

      - name: Rust tests (sba-core, cpu backend)
        if: runner.os == 'Linux'
        run: cargo test -p sba-core --no-default-features --features cpu

      # The debug exes must exist BEFORE pytest: test_encode_parity drives
      # sba_debug (found via the debug probe paths) and the Task 12 bench
      # will drive bench_burn the same way — one cpu debug build covers all
      # three bins. The Windows leg skips these tests (find_exe() -> None).
      - name: Build sba_debug (cpu)
        if: runner.os == 'Linux'
        run: cargo build -p sba-core --no-default-features --features cpu --bin sba_debug --bin sba_selfplay --bin bench_burn

      # PySide6 (the offscreen BoardWidget test) needs an EGL/GL stack on
      # the ubuntu runner; without it the import raises and collection fails
      - name: Install OpenGL/EGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install MinGW gcc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the mingw-builds CDN intermittently 504s (2026-11-08: two
          # consecutive failures) — retry before giving up
          for i in 1 2 3 4; do
            choco install mingw -y --no-progress && break
            echo "choco attempt $i failed; retrying in 20s"
            sleep 20
          done
          test -f /c/ProgramData/mingw64/mingw64/bin/gcc.exe || {
            echo "mingw gcc not installed"; exit 1; }
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Build native engine (sba_engine.dll)
        run: python src/tools/build.py

      - name: Run tests
        run: python -m pytest tests -q

      # The test matrix calls the engine modules directly; these three
      # entry points have their own argv routing and used to be unverified.
      # One OS is enough — the matrix above already covers both platforms.
      - name: CLI entry smoke
        if: runner.os == 'Linux'
        run: |
          python sba.py --self-test
          python sba.py --bench --games 1 --iters 20 --ai-a Basic --ai-b Random
          python sba.py --build-tables
