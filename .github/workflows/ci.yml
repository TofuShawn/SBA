name: CI

# PRs carry the checks for feature branches; push runs only on the default
# branch. Concurrency cancels superseded runs on the same ref (a rapid
# push used to queue two full matrix runs for the same commit).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # PySide6 (the offscreen BoardWidget test) needs an EGL/GL stack on
      # the ubuntu runner; without it the import raises and collection fails
      - name: Install OpenGL/EGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install MinGW gcc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the mingw-builds CDN intermittently 504s (2026-11-08: two
          # consecutive failures) — retry before giving up
          for i in 1 2 3 4; do
            choco install mingw -y --no-progress && break
            echo "choco attempt $i failed; retrying in 20s"
            sleep 20
          done
          test -f /c/ProgramData/mingw64/mingw64/bin/gcc.exe || {
            echo "mingw gcc not installed"; exit 1; }
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Build native engine (sba_engine.dll)
        run: python native/build.py

      - name: Run tests
        run: python -m pytest tests -q
