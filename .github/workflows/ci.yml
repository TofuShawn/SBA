name: CI

# PRs carry the checks for feature branches; push runs on main and on the
# integration branch dev (work landing there is CI-verified before the
# merge to main). Concurrency cancels superseded runs on the same ref.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint is platform-independent and needs no torch — a lone job reports
  # red in seconds, before the test matrix pays for any heavy install
  lint:
    name: Lint (ruff / format / mypy / C)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # Narrow mypy gate: ONLY the two ctypes FFI boundary modules, with
      # untyped bodies checked. The scope (ignore_missing_imports,
      # follow_imports=silent, the per-module check_untyped_defs override)
      # lives in pyproject [tool.mypy] so a wider run is an explicit choice,
      # not an accident.
      - name: Mypy (FFI boundary)
        run: mypy --check-untyped-defs src/engines/cengine.py src/az/rustbridge.py

      # D62: blocking gate. The lint env (requirements-dev + pip-audit, fresh
      # resolve) audits 0 findings, so `|| true` is gone — any NEW finding
      # fails the job. The 59 --ignore-vuln IDs are the D62 baseline for the
      # pillow 11.3.0 residue that lives only in the local dev venv:
      # parent-constrained by arcade==3.3.3 (pins pillow~=11.3.0; no 11.x fix
      # release exists, fixes start at 12.1.1). arcade is a local dev-tool
      # install that never appears in this CI env, so the flags are an inert
      # documented baseline — drop them once arcade allows pillow>=12.
      - name: pip-audit (gate)
        run: |
          pip install pip-audit
          IGNORED=(
            CVE-2026-112390  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112391  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112393  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112395  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112399  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112400  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112401  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112404  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112406  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112891  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112892  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112893  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112894  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112895  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112897  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112899  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-112900  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-128066  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-128067  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-96638  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-96640  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            CVE-2026-96778  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            GHSA-78g4-xqwv-q3g8  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-165  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2249  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2250  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2251  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2252  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2253  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2254  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2255  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2256  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2257  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-2874  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3451  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3453  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3454  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3493  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3494  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3495  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-3496  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
            PYSEC-2026-4326  # pillow: parent-pinned by arcade~=11.3.0, no 11.x fix (dev-venv only)
