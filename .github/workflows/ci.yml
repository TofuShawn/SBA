name: CI

# PRs carry the checks for feature branches; push runs on main and on the
# integration branch dev (work landing there is CI-verified before the
# merge to main). Concurrency cancels superseded runs on the same ref.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint is platform-independent and needs no torch — a lone job reports
  # red in seconds, before the test matrix pays for any heavy install
  lint:
    name: Lint (ruff / format / C)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      # The C engine used to compile with no warning flags at all, and
      # build.py swallowed successful builds' stderr. This is the gate;
      # -D__stdcall= is the same define build.py uses on a Linux host.
      - name: C warnings
        run: |
          for f in native/sba_ultt.c native/sba_rollout.c native/sba_mcts.c \
                   native/sba_rave.c native/sba_minimax.c; do
            gcc -std=c11 -fsyntax-only -Wall -Wextra -Werror \
                -D__stdcall= -Inative "$f"
          done

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      # the crate has compiled clean here since D49 — clippy is a gate now
      - name: Clippy
        run: cargo clippy --release --manifest-path native/sba-game/Cargo.toml -- -D warnings

      - name: Install Rust (Linux)
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Clippy (sba-core)
        if: runner.os == 'Linux'
        run: cargo clippy --release --manifest-path native/sba-core/Cargo.toml -- -D warnings

      - name: Rust tests (sba-core, cpu backend)
        if: runner.os == 'Linux'
        run: cargo test --manifest-path native/sba-core/Cargo.toml --no-default-features --features cpu

      # PySide6 (the offscreen BoardWidget test) needs an EGL/GL stack on
      # the ubuntu runner; without it the import raises and collection fails
      - name: Install OpenGL/EGL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install MinGW gcc (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # the mingw-builds CDN intermittently 504s (2026-11-08: two
          # consecutive failures) — retry before giving up
          for i in 1 2 3 4; do
            choco install mingw -y --no-progress && break
            echo "choco attempt $i failed; retrying in 20s"
            sleep 20
          done
          test -f /c/ProgramData/mingw64/mingw64/bin/gcc.exe || {
            echo "mingw gcc not installed"; exit 1; }
          echo "C:\ProgramData\mingw64\mingw64\bin" >> "$GITHUB_PATH"

      - name: Build native engine (sba_engine.dll)
        run: python native/build.py

      - name: Run tests
        run: python -m pytest tests -q

      # The test matrix calls the engine modules directly; these three
      # entry points have their own argv routing and used to be unverified.
      # One OS is enough — the matrix above already covers both platforms.
      - name: CLI entry smoke
        if: runner.os == 'Linux'
        run: |
          python sba.py --self-test
          python sba.py --bench --games 1 --iters 20 --ai-a Basic --ai-b Random
          python sba.py --build-tables
